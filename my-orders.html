<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ferikart — My Orders">
  <title>ferikart — My Orders</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- ═══════════ NAVBAR ═══════════ -->
  <nav class="navbar" id="navbar">
    <a href="home.html" class="navbar__logo" aria-label="ferikart Home">
      <img src="images/logo.png" alt="ferikart logo" class="navbar__logo-img" />
    </a>
    <div class="navbar__actions" id="navActions">
      <button class="cart-btn" id="cartBtn" aria-label="Shopping cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <circle cx="9" cy="21" r="1" />
          <circle cx="20" cy="21" r="1" />
          <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6" />
        </svg>
        <span class="cart-btn__badge" id="cartBadge">0</span>
        <span class="cart-btn__label">Cart</span>
      </button>
    </div>
  </nav>

  <!-- ═══════════ MY ORDERS PAGE CONTENT ═══════════ -->
  <div class="account-page">
    <div class="account-page__header">
      <a href="home.html" class="category-back-btn" aria-label="Go back to Home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12" />
          <polyline points="12 19 5 12 12 5" />
        </svg>
      </a>
      <h1 class="account-page__title">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: sub; margin-right: 6px;">
          <path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/>
          <path d="M12 12l8-4.5"/>
          <path d="M12 12v9"/>
          <path d="M12 12L4 7.5"/>
        </svg> My Orders
      </h1>
    </div>

    <div class="orders-list" id="ordersList"></div>

    <div class="cart-page__empty" id="ordersEmpty" style="display: none;">
      <div class="cart-page__empty-icon">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/>
          <path d="M12 12l8-4.5"/>
          <path d="M12 12v9"/>
          <path d="M12 12L4 7.5"/>
        </svg>
      </div>
      <h2 class="cart-page__empty-title">No Orders Yet</h2>
      <p class="cart-page__empty-sub">You haven't placed any orders yet. Explore our home furnishing collection!</p>
      <a href="home.html" class="cart-page__empty-btn">Start Shopping</a>
    </div>
  </div>

  <!-- ═══════════ FOOTER ═══════════ -->
  <footer class="footer">
    <div class="footer__bottom">
      <p>© 2026 ferikart™ — Chalti firti dukan. All rights reserved.</p>
    </div>
  </footer>

  <!-- ═══════════ TRACK PACKAGE MODAL ═══════════ -->
  <div class="tracking-modal-overlay" id="trackingModal" style="display: none;">
    <div class="tracking-modal">
      <div class="tracking-modal__header">
        <div>
          <h2 class="tracking-modal__title" id="trackModalTitle">Track Shipment</h2>
          <p class="tracking-modal__subtitle" id="trackModalSub">Order #</p>
        </div>
        <button class="tracking-modal__close" onclick="closeTrackingModal()" aria-label="Close tracking modal">&times;</button>
      </div>

      <div class="tracking-modal__info-bar">
        <div class="tracking-info-item">
          <span class="tracking-info-label">Courier Partner</span>
          <span class="tracking-info-val" id="trackCourier">BlueDart Express</span>
        </div>
        <div class="tracking-info-item">
          <span class="tracking-info-label">Tracking Number</span>
          <span class="tracking-info-val" id="trackNumber">BD-84920492</span>
        </div>
        <div class="tracking-info-item">
          <span class="tracking-info-label">Estimated Delivery</span>
          <span class="tracking-info-val" id="trackEstDate">—</span>
        </div>
      </div>

      <!-- Step-by-step Timeline -->
      <div class="tracking-timeline" id="trackingTimeline"></div>

      <div class="tracking-modal__footer">
        <button class="order-action-btn" onclick="closeTrackingModal()">Close</button>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
  <script type="module" src="js/firebase-auth-global.js"></script>
</body>

</html>
