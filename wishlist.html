<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ferikart — Your Wishlist">
  <title>ferikart — Wishlist</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- ═══════════ NAVBAR ═══════════ -->
  <nav class="navbar" id="navbar">
    <a href="home.html" class="navbar__logo" aria-label="ferikart Home">
      <img src="images/logo.png" alt="ferikart logo" class="navbar__logo-img" />
    </a>
    <div class="navbar__actions" id="navActions">
      <button class="cart-btn" id="cartBtn" aria-label="Shopping cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <circle cx="9" cy="21" r="1" />
          <circle cx="20" cy="21" r="1" />
          <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6" />
        </svg>
        <span class="cart-btn__badge" id="cartBadge">0</span>
        <span class="cart-btn__label">Cart</span>
      </button>
    </div>
  </nav>

  <!-- ═══════════ WISHLIST PAGE CONTENT ═══════════ -->
  <div class="account-page">
    <div class="account-page__header">
      <a href="home.html" class="category-back-btn" aria-label="Go back to Home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12" />
          <polyline points="12 19 5 12 12 5" />
        </svg>
      </a>
      <h1 class="account-page__title">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: sub; margin-right: 6px; color: var(--brand-terracotta);">
          <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>
        </svg> My Wishlist
      </h1>
    </div>

    <!-- Wishlist Toolbar (Select All & Bulk Actions) -->
    <div class="wishlist-toolbar" id="wishlistToolbar" style="display: flex;">
      <label class="wishlist-select-all">
        <input type="checkbox" id="selectAllWishlist" onchange="toggleSelectAllWishlist(this.checked)">
        <span>Select All</span>
      </label>
      <div class="wishlist-toolbar-actions">
        <button type="button" class="wishlist-btn-action wishlist-btn-cart" onclick="moveSelectedWishlistToCart()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: sub; margin-right: 4px;">
            <circle cx="9" cy="21" r="1"/>
            <circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/>
          </svg> Move Selected to Cart
        </button>
        <button type="button" class="wishlist-btn-action wishlist-btn-delete" onclick="removeSelectedWishlistItems()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: sub; margin-right: 4px;">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
          </svg> Remove Selected
        </button>
      </div>
    </div>

    <div class="wishlist-grid" id="wishlistGrid"></div>

    <!-- Empty State -->
    <div class="cart-page__empty" id="wishlistEmpty" style="display: none;">
      <div class="cart-page__empty-icon">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--gray-400);">
          <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>
        </svg>
      </div>
      <h2 class="cart-page__empty-title">Your Wishlist is Empty</h2>
      <p class="cart-page__empty-sub">Explore our products and tap the heart icon to save items you love!</p>
      <a href="home.html" class="cart-page__empty-btn">Discover Products</a>
    </div>
  </div>

  <!-- ═══════════ FOOTER ═══════════ -->
  <footer class="footer">
    <div class="footer__bottom">
      <p>© 2026 ferikart™ — Chalti firti dukan. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/script.js"></script>
  <script type="module" src="js/firebase-auth-global.js"></script>
</body>

</html>
