<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ferikart — Your Shopping Cart">
  <title>ferikart — Cart</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- ═══════════ NAVBAR ═══════════ -->
  <nav class="navbar" id="navbar">
    <a href="home.html" class="navbar__logo" aria-label="ferikart Home">
      <img src="images/logo.png" alt="ferikart logo" class="navbar__logo-img" />
    </a>
    <div class="navbar__actions" id="navActions">
      <button class="cart-btn" id="cartBtn" aria-label="Shopping cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <circle cx="9" cy="21" r="1" />
          <circle cx="20" cy="21" r="1" />
          <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6" />
        </svg>
        <span class="cart-btn__badge" id="cartBadge">0</span>
        <span class="cart-btn__label">Cart</span>
      </button>
    </div>
  </nav>

  <!-- ═══════════ CART PAGE CONTENT ═══════════ -->
  <div class="cart-page">
    <div class="cart-page__header">
      <a href="home.html" class="category-back-btn" aria-label="Go back to Home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12" />
          <polyline points="12 19 5 12 12 5" />
        </svg>
      </a>
      <h1 class="cart-page__title">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: sub; margin-right: 6px;">
          <circle cx="9" cy="21" r="1"/>
          <circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/>
        </svg> Your Cart
      </h1>
      <span class="cart-page__count" id="cartPageCount"></span>
    </div>

    <!-- Cart Items Container -->
    <div class="cart-page__items" id="cartPageItems"></div>

    <!-- Empty State -->
    <div class="cart-page__empty" id="cartPageEmpty" style="display: none;">
      <div class="cart-page__empty-icon">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--gray-400);">
          <circle cx="9" cy="21" r="1"/>
          <circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/>
        </svg>
      </div>
      <h2 class="cart-page__empty-title">Your cart is empty</h2>
      <p class="cart-page__empty-sub">Looks like you haven't added anything yet. Start exploring our collections!</p>
      <a href="home.html" class="cart-page__empty-btn">Browse Products</a>
    </div>

    <!-- Cart Summary Footer -->
    <div class="cart-page__summary" id="cartPageSummary" style="display: none;">
      <div class="cart-page__summary-row">
        <span>Subtotal</span>
        <span class="cart-page__subtotal" id="cartPageSubtotal">₹0</span>
      </div>
      <div class="cart-page__summary-row cart-page__summary-row--shipping">
        <span>Shipping</span>
        <span class="cart-page__shipping">FREE</span>
      </div>
      <div class="cart-page__summary-row cart-page__summary-row--total">
        <span>Total</span>
        <span class="cart-page__total" id="cartPageTotal">₹0</span>
      </div>
      <button class="cart-page__checkout-btn" onclick="checkProceedToCheckout(event)">Proceed to Checkout</button>
      <a href="home.html" class="cart-page__continue-link">← Continue Shopping</a>
    </div>
  </div>

  <!-- ═══════════ FOOTER ═══════════ -->
  <footer class="footer">
    <div class="footer__bottom">
      <p>© 2026 ferikart™ — Chalti firti dukan. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/script.js"></script>
  <script type="module" src="js/firebase-auth-global.js"></script>
</body>

</html>
